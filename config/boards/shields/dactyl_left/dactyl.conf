# Bluetooth Low Energy settings
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_HIDS=y

# BLE Controller
CONFIG_BT_CTLR=y
CONFIG_BT_HCI_VS_EXT=y

# Connection settings
CONFIG_BT_CONN_TX_MAX=3

# ZMK BLE settings - LEFT SIDE (Peripheral)
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_PERIPHERAL=y

# USB support (for debugging and wired mode)
CONFIG_USB_DEVICE_STACK=y

# Logging for debugging Bluetooth issues
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_CONSOLE=y

# KSCAN debounce
CONFIG_ZMK_KSCAN_EVENT_MANAGER=y
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=15
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=15
